name: Notificação HomeMode

on:
  schedule:
    # Horário em UTC — Brasil (BRT) é UTC-3
    # Se você chega às 18:00 BRT → coloca 21:00 UTC → "0 21 * * *"
    # Se você chega às 17:00 BRT → coloca 20:00 UTC → "0 20 * * *"
    # Formato: "minuto hora * * *"
    - cron: "0 21 * * 1-5"  # 18:00 BRT, segunda a sexta
  workflow_dispatch: # permite disparar manualmente pelo GitHub pra testar

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificação pro celular
        run: |
          curl -X POST https://ntfy.sh/${{ secrets.NTFY_TOPIC }} \
            -H "Title: 🏠 HomeMode" \
            -H "Priority: high" \
            -H "Tags: house,rocket" \
            -d "Você chegou em casa. Não perde o controle agora. 20 minutos. Bora. 🚀"
